<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lock In — Habit Ledger</title>
<meta name="theme-color" content="#1b1b1d">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Lock In">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink: #1b1b1d;
    --ink-soft: #29292b;
    --paper: #f6efe0;
    --paper-line: #e3d5b6;
    --amber: #d97a1f;
    --amber-deep: #b8560f;
    --moss: #4b6b4f;
    --text: #2b2a28;
    --muted: #8c8272;
    --cream-strong: #fbf6ea;
  }

  *{ box-sizing: border-box; }
  html,body{ margin:0; padding:0; }
  body{
    background: var(--ink);
    color: var(--text);
    font-family: 'Inter', sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  .app{ max-width: 1080px; margin: 0 auto; min-height: 100vh; display:flex; flex-direction:column; }

  /* ---------- Control panel ---------- */
  .control-panel{
    background: var(--ink);
    color: var(--paper);
    padding: 22px 24px 26px;
    display:flex;
    align-items:flex-end;
    justify-content:space-between;
    gap:24px;
    flex-wrap:wrap;
    border-bottom: 3px solid var(--amber);
  }
  .brand{ display:flex; flex-direction:column; gap:2px; }
  .brand .stamp{
    font-family:'Oswald', sans-serif;
    font-weight:700;
    font-size:34px;
    letter-spacing:2px;
    color: var(--paper);
    line-height:1;
  }
  .brand .subtitle{
    font-family:'IBM Plex Mono', monospace;
    font-size:11px;
    letter-spacing:4px;
    color: var(--amber);
  }

  .week-nav{ display:flex; align-items:center; gap:10px; }
  .week-nav button{
    width:34px; height:34px;
    border-radius:4px;
    border:1px solid rgba(246,239,224,0.25);
    background: var(--ink-soft);
    color: var(--paper);
    font-size:18px;
    cursor:pointer;
    line-height:1;
  }
  .week-nav button:hover{ background:#38383b; }
  .week-nav button:focus-visible, button:focus-visible, input:focus-visible, .stamp-box:focus-visible{
    outline: 2px solid var(--amber);
    outline-offset: 2px;
  }
  .week-range{
    font-family:'IBM Plex Mono', monospace;
    font-size:14px;
    letter-spacing:1px;
    min-width:150px;
    text-align:center;
  }

  .gauge-wrap{ display:flex; flex-direction:column; gap:6px; min-width:220px; }
  .gauge-label{
    font-family:'IBM Plex Mono', monospace;
    font-size:10px;
    letter-spacing:3px;
    color: var(--muted);
  }
  .gauge{
    position:relative;
    width:220px; height:18px;
    background: var(--ink-soft);
    border:1px solid rgba(246,239,224,0.2);
    border-radius:3px;
    overflow:hidden;
  }
  .gauge-fill{
    position:absolute; inset:0 auto 0 0;
    width:0%;
    background: linear-gradient(90deg, var(--amber-deep), var(--amber));
    transition: width 0.5s cubic-bezier(.2,.8,.2,1);
  }
  .gauge-fill.full{ background: linear-gradient(90deg, var(--amber), var(--moss)); }
  .gauge-ticks{
    position:absolute; inset:0;
    display:flex;
    pointer-events:none;
  }
  .gauge-ticks span{
    flex:1;
    border-right:1px solid rgba(27,27,29,0.35);
  }
  .gauge-ticks span:last-child{ border-right:none; }
  .gauge-pct{
    font-family:'IBM Plex Mono', monospace;
    font-size:13px;
    color: var(--amber);
    align-self:flex-end;
  }

  /* ---------- Ledger ---------- */
  .ledger-wrap{ background: var(--paper); flex:1; padding: 20px 0 0; }
  .ledger-scroll{ overflow-x:auto; padding: 0 24px; }
  table.ledger{
    border-collapse: collapse;
    width:100%;
    min-width: 760px;
    font-family:'IBM Plex Mono', monospace;
  }
  table.ledger thead th{
    font-family:'Oswald', sans-serif;
    font-weight:600;
    font-size:12px;
    letter-spacing:1.5px;
    text-transform:uppercase;
    color: var(--ink);
    background: var(--cream-strong);
    border-bottom: 2px solid var(--ink);
    padding: 10px 6px;
    text-align:center;
    position:sticky;
    top:0;
  }
  th.col-habit{ text-align:left; padding-left:4px; min-width:190px; position:sticky; left:0; z-index:2; background:var(--cream-strong); }
  th.col-goal{ min-width:70px; }
  th.col-day{ min-width:56px; }
  th.col-day .date-num{ display:block; font-family:'IBM Plex Mono',monospace; font-weight:400; font-size:11px; color: var(--muted); margin-top:2px; }
  th.col-day.today{ color: var(--amber-deep); }
  th.col-streak{ min-width:64px; }
  th.col-actions{ width:36px; }

  tbody tr{ border-bottom:1px solid var(--paper-line); }
  tbody tr:hover{ background: rgba(217,122,31,0.06); }
  td{ padding: 8px 6px; text-align:center; vertical-align:middle; }
  td.habit-cell{
    text-align:left;
    padding-left:4px;
    position:sticky; left:0;
    background: var(--paper);
    z-index:1;
    display:flex;
    align-items:center;
    gap:8px;
    min-width:190px;
  }
  tbody tr:hover td.habit-cell{ background:#f2e6cd; }
  .habit-emoji{ font-size:18px; width:22px; text-align:center; flex-shrink:0; }
  .habit-name{
    border:none; background:transparent;
    font-family:'Inter', sans-serif;
    font-size:14px;
    color: var(--text);
    width:100%;
    padding:2px 0;
  }

  .goal-cell{ font-size:12px; color: var(--muted); }
  .goal-frac{ font-weight:600; color: var(--text); }
  .goal-input{
    width:34px; border:none; background:transparent;
    font-family:'IBM Plex Mono', monospace;
    font-size:12px; text-align:center; color: var(--muted);
  }
  .goal-met{ color: var(--moss); font-weight:700; }

  .stamp-box{
    width:30px; height:30px;
    border:2px solid var(--paper-line);
    border-radius:4px;
    background: var(--cream-strong);
    cursor:pointer;
    display:inline-flex; align-items:center; justify-content:center;
    font-size:15px;
    color:transparent;
    position:relative;
  }
  .stamp-box:hover{ border-color: var(--amber); }
  .stamp-box.checked{
    background: var(--amber);
    border-color: var(--amber-deep);
    color: var(--cream-strong);
    transform: rotate(-4deg);
    animation: stampPop 0.22s ease-out;
  }
  @keyframes stampPop{
    0%{ transform: scale(1.5) rotate(-10deg); opacity:0.3; }
    100%{ transform: scale(1) rotate(-4deg); opacity:1; }
  }
  @media (prefers-reduced-motion: reduce){
    .stamp-box.checked{ animation:none; }
    .gauge-fill{ transition:none; }
  }

  .streak-cell{ font-size:12px; color: var(--muted); white-space:nowrap; }
  .streak-cell.active{ color: var(--amber-deep); font-weight:600; }

  .del-btn{
    border:none; background:transparent; color: var(--muted);
    cursor:pointer; font-size:16px; line-height:1;
  }
  .del-btn:hover{ color: var(--amber-deep); }

  /* ---------- Add row ---------- */
  .add-row{
    display:flex; gap:8px; align-items:center; flex-wrap:wrap;
    padding: 16px 24px 22px;
    background: var(--paper);
  }
  .add-row input{
    font-family:'Inter', sans-serif;
    border:1px solid var(--paper-line);
    background: var(--cream-strong);
    border-radius:4px;
    padding: 8px 10px;
    font-size:14px;
    color: var(--text);
  }
  #newEmoji{ width:52px; text-align:center; font-size:16px; }
  #newName{ flex:1; min-width:160px; }
  #newGoal{ width:64px; font-family:'IBM Plex Mono', monospace; }
  #addHabitBtn{
    font-family:'Oswald', sans-serif;
    font-weight:600;
    letter-spacing:1px;
    text-transform:uppercase;
    font-size:13px;
    background: var(--ink);
    color: var(--paper);
    border:none;
    border-radius:4px;
    padding:10px 18px;
    cursor:pointer;
  }
  #addHabitBtn:hover{ background: var(--amber-deep); }

  /* ---------- Footer ---------- */
  .log-actions{
    background: var(--ink);
    color: var(--paper);
    display:flex; align-items:center; gap:14px; flex-wrap:wrap;
    padding: 14px 24px;
    margin-top:auto;
  }
  .log-actions button, .import-btn{
    font-family:'IBM Plex Mono', monospace;
    font-size:12px;
    letter-spacing:1px;
    background: var(--ink-soft);
    color: var(--paper);
    border:1px solid rgba(246,239,224,0.25);
    border-radius:4px;
    padding:8px 12px;
    cursor:pointer;
  }
  .log-actions button:hover, .import-btn:hover{ border-color: var(--amber); color: var(--amber); }
  .footnote{ font-size:11px; color: var(--muted); font-family:'IBM Plex Mono', monospace; }

  .empty-state{
    padding: 30px 24px; text-align:center; color: var(--muted);
    font-family:'IBM Plex Mono', monospace; font-size:13px;
  }

  @media (max-width: 640px){
    .control-panel{ padding:18px 16px 20px; }
    .brand .stamp{ font-size:26px; }
    .gauge{ width:170px; }
    .gauge-wrap{ min-width:170px; }
    .ledger-scroll{ padding:0 16px; }
    .add-row{ padding:14px 16px 18px; }
    .log-actions{ padding:12px 16px; }
  }
</style>
</head>
<body>

<div class="app">

  <header class="control-panel">
    <div class="brand">
      <span class="stamp">LOCK IN</span>
      <span class="subtitle">HABIT LEDGER</span>
    </div>

    <div class="week-nav">
      <button id="prevWeek" aria-label="Previous week">‹</button>
      <div class="week-range" id="weekRange">—</div>
      <button id="nextWeek" aria-label="Next week">›</button>
    </div>

    <div class="gauge-wrap">
      <span class="gauge-label">WEEKLY LOCK-IN</span>
      <div class="gauge">
        <div class="gauge-fill" id="gaugeFill"></div>
        <div class="gauge-ticks">
          <span></span><span></span><span></span><span></span><span></span>
          <span></span><span></span><span></span><span></span><span></span>
        </div>
      </div>
      <span class="gauge-pct" id="gaugePct">0%</span>
    </div>
  </header>

  <main class="ledger-wrap">
    <div class="ledger-scroll">
      <table class="ledger" id="ledgerTable">
        <thead>
          <tr id="headRow">
            <th class="col-habit">Daily Habits</th>
            <th class="col-goal">Goal</th>
            <th class="col-day" data-day="0">Sun<span class="date-num"></span></th>
            <th class="col-day" data-day="1">Mon<span class="date-num"></span></th>
            <th class="col-day" data-day="2">Tue<span class="date-num"></span></th>
            <th class="col-day" data-day="3">Wed<span class="date-num"></span></th>
            <th class="col-day" data-day="4">Thu<span class="date-num"></span></th>
            <th class="col-day" data-day="5">Fri<span class="date-num"></span></th>
            <th class="col-day" data-day="6">Sat<span class="date-num"></span></th>
            <th class="col-streak">Streak</th>
            <th class="col-actions"></th>
          </tr>
        </thead>
        <tbody id="ledgerBody"></tbody>
      </table>
    </div>

    <div class="add-row">
      <input id="newEmoji" maxlength="2" placeholder="🎯" aria-label="Habit emoji">
      <input id="newName" placeholder="New habit…" aria-label="Habit name">
      <input id="newGoal" type="number" min="1" max="7" value="7" aria-label="Weekly goal (days)">
      <button id="addHabitBtn">+ Add to ledger</button>
    </div>
  </main>

  <footer class="log-actions">
    <button id="exportBtn">⭳ Save log</button>
    <label class="import-btn">⭱ Load log<input type="file" id="importFile" accept="application/json" hidden></label>
    <span class="footnote">Progress lives in this tab only — save your log before you close it.</span>
  </footer>

</div>

<script>
(function(){
  "use strict";

  function uid(){ return 'h_' + Math.random().toString(36).slice(2,9); }

  function defaultHabits(){
    return [
      { id: uid(), emoji:'⏰', name:'Wake up at 6 AM', goal:7 },
      { id: uid(), emoji:'🏋️', name:'Workout', goal:5 },
      { id: uid(), emoji:'📖', name:'Read 20 pages', goal:7 },
      { id: uid(), emoji:'💰', name:'Track budget', goal:7 },
      { id: uid(), emoji:'🌿', name:'Social media detox', goal:5 },
      { id: uid(), emoji:'📝', name:'Journal my day', goal:7 },
      { id: uid(), emoji:'🚿', name:'Cold shower', goal:7 },
      { id: uid(), emoji:'🥗', name:'Eat healthy', goal:6 }
    ];
  }

  var state = {
    habits: defaultHabits(),
    checks: {} // key: habitId + '__' + isoDate -> true
  };

  function startOfDay(d){ var x = new Date(d); x.setHours(0,0,0,0); return x; }

  function sundayOf(d){
    var x = startOfDay(d);
    x.setDate(x.getDate() - x.getDay());
    return x;
  }

  var weekStart = sundayOf(new Date());

  function isoDate(d){
    var y = d.getFullYear();
    var m = String(d.getMonth()+1).padStart(2,'0');
    var day = String(d.getDate()).padStart(2,'0');
    return y + '-' + m + '-' + day;
  }

  function checkKey(habitId, iso){ return habitId + '__' + iso; }
  function isChecked(habitId, iso){ return !!state.checks[checkKey(habitId, iso)]; }

  function toggleCheck(habitId, iso){
    var key = checkKey(habitId, iso);
    if(state.checks[key]) delete state.checks[key];
    else state.checks[key] = true;
  }

  function fmtRange(start){
    var end = new Date(start); end.setDate(end.getDate()+6);
    var optsShort = { month:'short', day:'numeric' };
    var startStr = start.toLocaleDateString('en-US', optsShort);
    var endStr = end.toLocaleDateString('en-US', optsShort);
    var year = start.getFullYear();
    return startStr + ' – ' + endStr + ', ' + year;
  }

  function weekCount(habitId){
    var count = 0;
    for(var i=0;i<7;i++){
      var d = new Date(weekStart); d.setDate(d.getDate()+i);
      if(isChecked(habitId, isoDate(d))) count++;
    }
    return count;
  }

  function computeStreak(habitId){
    var streak = 0;
    var d = startOfDay(new Date());
    while(true){
      var iso = isoDate(d);
      if(isChecked(habitId, iso)){ streak++; d.setDate(d.getDate()-1); }
      else break;
    }
    return streak;
  }

  function overallPct(){
    if(state.habits.length === 0) return 0;
    var total = 0, done = 0;
    state.habits.forEach(function(h){ total += 7; done += weekCount(h.id); });
    if(total === 0) return 0;
    return Math.round(done/total*100);
  }

  var todayIso = isoDate(new Date());

  function render(){
    document.getElementById('weekRange').textContent = fmtRange(weekStart);

    var headRow = document.getElementById('headRow');
    headRow.querySelectorAll('.col-day').forEach(function(th){
      var dayIdx = parseInt(th.getAttribute('data-day'), 10);
      var d = new Date(weekStart); d.setDate(d.getDate() + dayIdx);
      th.querySelector('.date-num').textContent = ' ' + d.getDate();
      th.classList.toggle('today', isoDate(d) === todayIso);
    });

    var tbody = document.getElementById('ledgerBody');
    tbody.innerHTML = '';

    if(state.habits.length === 0){
      var tr = document.createElement('tr');
      var td = document.createElement('td');
      td.colSpan = 11;
      td.className = 'empty-state';
      td.textContent = 'No habits logged yet. Add your first line below.';
      tr.appendChild(td);
      tbody.appendChild(tr);
    }

    state.habits.forEach(function(h){
      var tr = document.createElement('tr');

      // habit cell
      var tdHabit = document.createElement('td');
      tdHabit.className = 'habit-cell';
      var emojiSpan = document.createElement('span');
      emojiSpan.className = 'habit-emoji';
      emojiSpan.textContent = h.emoji || '🎯';
      var nameInput = document.createElement('input');
      nameInput.className = 'habit-name';
      nameInput.value = h.name;
      nameInput.setAttribute('aria-label', 'Habit name');
      nameInput.addEventListener('change', function(){
        h.name = nameInput.value.trim() || h.name;
      });
      tdHabit.appendChild(emojiSpan);
      tdHabit.appendChild(nameInput);
      tr.appendChild(tdHabit);

      // goal cell
      var tdGoal = document.createElement('td');
      tdGoal.className = 'goal-cell';
      var count = weekCount(h.id);
      var frac = document.createElement('span');
      frac.className = 'goal-frac' + (count >= h.goal ? ' goal-met' : '');
      frac.textContent = count + '/';
      var goalInput = document.createElement('input');
      goalInput.type = 'number';
      goalInput.min = '1'; goalInput.max = '7';
      goalInput.className = 'goal-input';
      goalInput.value = h.goal;
      goalInput.setAttribute('aria-label', 'Weekly goal for ' + h.name);
      goalInput.addEventListener('change', function(){
        var v = parseInt(goalInput.value, 10);
        h.goal = (isNaN(v) || v < 1) ? 1 : (v > 7 ? 7 : v);
        render();
      });
      tdGoal.appendChild(frac);
      tdGoal.appendChild(goalInput);
      tr.appendChild(tdGoal);

      // day cells
      for(var i=0;i<7;i++){
        var d = new Date(weekStart); d.setDate(d.getDate()+i);
        var iso = isoDate(d);
        var tdDay = document.createElement('td');
        var btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'stamp-box' + (isChecked(h.id, iso) ? ' checked' : '');
        btn.setAttribute('aria-pressed', isChecked(h.id, iso) ? 'true' : 'false');
        btn.setAttribute('aria-label', h.name + ' on ' + iso);
        btn.textContent = isChecked(h.id, iso) ? '✓' : '';
        (function(habitId, dateIso, buttonEl){
          buttonEl.addEventListener('click', function(){
            toggleCheck(habitId, dateIso);
            render();
          });
        })(h.id, iso, btn);
        tdDay.appendChild(btn);
        tr.appendChild(tdDay);
      }

      // streak cell
      var tdStreak = document.createElement('td');
      var streak = computeStreak(h.id);
      tdStreak.className = 'streak-cell' + (streak > 0 ? ' active' : '');
      tdStreak.textContent = streak > 0 ? ('🔥 ' + streak) : '—';
      tr.appendChild(tdStreak);

      // delete cell
      var tdActions = document.createElement('td');
      var delBtn = document.createElement('button');
      delBtn.className = 'del-btn';
      delBtn.type = 'button';
      delBtn.setAttribute('aria-label', 'Remove ' + h.name);
      delBtn.textContent = '✕';
      delBtn.addEventListener('click', function(){
        if(confirm('Remove "' + h.name + '" from your ledger?')){
          state.habits = state.habits.filter(function(x){ return x.id !== h.id; });
          render();
        }
      });
      tdActions.appendChild(delBtn);
      tr.appendChild(tdActions);

      tbody.appendChild(tr);
    });

    var pct = overallPct();
    var fill = document.getElementById('gaugeFill');
    fill.style.width = pct + '%';
    fill.classList.toggle('full', pct >= 100);
    document.getElementById('gaugePct').textContent = pct + '%';
  }

  // --- navigation ---
  document.getElementById('prevWeek').addEventListener('click', function(){
    weekStart.setDate(weekStart.getDate() - 7);
    render();
  });
  document.getElementById('nextWeek').addEventListener('click', function(){
    weekStart.setDate(weekStart.getDate() + 7);
    render();
  });

  // --- add habit ---
  document.getElementById('addHabitBtn').addEventListener('click', function(){
    var emojiEl = document.getElementById('newEmoji');
    var nameEl = document.getElementById('newName');
    var goalEl = document.getElementById('newGoal');
    var name = nameEl.value.trim();
    if(!name){ nameEl.focus(); return; }
    var goal = parseInt(goalEl.value, 10);
    if(isNaN(goal) || goal < 1) goal = 1;
    if(goal > 7) goal = 7;
    state.habits.push({
      id: uid(),
      emoji: emojiEl.value.trim() || '🎯',
      name: name,
      goal: goal
    });
    emojiEl.value = '';
    nameEl.value = '';
    goalEl.value = 7;
    render();
    nameEl.focus();
  });

  document.getElementById('newName').addEventListener('keydown', function(e){
    if(e.key === 'Enter') document.getElementById('addHabitBtn').click();
  });

  // --- export / import ---
  document.getElementById('exportBtn').addEventListener('click', function(){
    var payload = JSON.stringify({ habits: state.habits, checks: state.checks }, null, 2);
    var blob = new Blob([payload], { type: 'application/json' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = 'lock-in-log-' + isoDate(new Date()) + '.json';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  });

  document.getElementById('importFile').addEventListener('change', function(e){
    var file = e.target.files[0];
    if(!file) return;
    var reader = new FileReader();
    reader.onload = function(evt){
      try{
        var data = JSON.parse(evt.target.result);
        if(!data || !Array.isArray(data.habits)) throw new Error('bad format');
        state.habits = data.habits.map(function(h){
          return {
            id: h.id || uid(),
            emoji: h.emoji || '🎯',
            name: h.name || 'Habit',
            goal: (typeof h.goal === 'number' && h.goal >=1 && h.goal <=7) ? h.goal : 7
          };
        });
        state.checks = (data.checks && typeof data.checks === 'object') ? data.checks : {};
        render();
      }catch(err){
        alert('That file could not be read as a Lock In log.');
      }
      e.target.value = '';
    };
    reader.readAsText(file);
  });

  render();

  if('serviceWorker' in navigator){
    window.addEventListener('load', function(){
